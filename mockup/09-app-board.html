<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목업 · 자랑 게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="04-app-exercise.html">
      <div class="brand-mark">홈</div>
      <div class="brand-name">우리동네<br>홈트챌린지<small>HOME TRAINING</small></div>
    </a>
    <div class="navitem"><span class="navicon"></span>운동</div>
    <div class="navitem"><span class="navicon"></span>미션</div>
    <div class="navitem"><span class="navicon"></span>나의 프로필</div>
    <div class="navitem"><span class="navicon"></span>포인트 상점</div>
    <div class="navitem"><span class="navicon"></span>홈크루</div>
    <div class="navitem"><span class="navicon"></span>랭킹</div>
    <div class="navitem active"><span class="navicon"></span>자랑 게시판</div>
    <div class="navitem"><span class="navicon"></span>고객센터</div>
    <div class="navitem"><span class="navicon"></span>계정 및 설정</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">자랑 게시판</div>
        <div class="topbar-sub">서울시 강남구 역삼동</div>
      </div>
      <div class="user-chip">
        <div class="points-pill">P <span class="mono">3,240</span></div>
        <span class="topbar-nick">써니핏</span>
        <div class="topbar-avatar">
          <div style="width:36px;height:36px;border-radius:50%;border:2px solid var(--outline);background:var(--surface-2);"></div>
          <span class="mono">Lv.7</span>
        </div>
      </div>
    </div>
    <div class="view">
      <div class="view-head">
        <h1>자랑 게시판</h1>
        <p>이웃들과 오늘의 운동을 공유해보세요</p>
      </div>
      <div style="margin-bottom:18px;"><button class="btn btn-primary">글 작성하기</button></div>

      <div class="grid grid-2">
        <div class="card feed-card">
          <div class="feed-head">
            <div class="user-avatar" style="background:var(--sky);">런</div>
            <div>
              <div style="font-weight:700;font-size:13.5px;">런닝수달</div>
              <div class="hint" style="margin:0;">2시간 전 · 역삼동</div>
            </div>
          </div>
          <div class="feed-media">운동 인증 사진</div>
          <p class="desc" style="margin:0;">오늘 스쿼트 100개 채웠습니다 💪</p>
          <div class="feed-actions">
            <button>❤️ 12</button>
            <button>💬 3</button>
          </div>
        </div>
        <div class="card feed-card">
          <div class="feed-head">
            <div class="user-avatar" style="background:var(--coral);">단</div>
            <div>
              <div style="font-weight:700;font-size:13.5px;">단백질맨</div>
              <div class="hint" style="margin:0;">어제 · 역삼동</div>
            </div>
          </div>
          <div class="feed-media">운동 인증 사진</div>
          <p class="desc" style="margin:0;">플랭크 3분 신기록! 다들 화이팅하세요.</p>
          <div class="feed-actions">
            <button>❤️ 8</button>
            <button>💬 1</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
