<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목업 · 회원가입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="center-shell">
  <div class="auth-card">
    <p class="auth-eyebrow">우리동네 홈트챌린지</p>
    <h1 class="auth-title">회원가입</h1>
    <p class="auth-sub">AI 자세 분석과 지역 랭킹으로 함께하는 홈트레이닝</p>

    <div class="field">
      <label for="su-id">아이디</label>
      <div class="field-row">
        <input id="su-id" type="text" placeholder="영문/숫자 4자 이상" style="flex:1;min-width:0;" value="hometrainer02">
        <button type="button" class="btn btn-secondary btn-sm" style="flex:none;white-space:nowrap;">중복확인</button>
      </div>
      <p class="hint" style="color:var(--accent);">사용 가능한 아이디입니다</p>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="su-pw">비밀번호</label>
        <input id="su-pw" type="password" placeholder="••••••••" value="••••••••">
      </div>
      <div class="field">
        <label for="su-pw2">비밀번호 확인</label>
        <input id="su-pw2" type="password" placeholder="••••••••" value="•••••••">
        <p class="hint" style="color:var(--danger);">비밀번호가 일치하지 않습니다</p>
      </div>
    </div>
    <div class="field">
      <label for="su-nick">닉네임</label>
      <div class="field-row">
        <input id="su-nick" type="text" placeholder="홈트에서 사용할 닉네임" style="flex:1;min-width:0;" value="써니핏">
        <button type="button" class="btn btn-secondary btn-sm" style="flex:none;white-space:nowrap;">중복확인</button>
      </div>
      <p class="hint" style="color:var(--danger);">이미 사용중인 닉네임입니다</p>
    </div>
    <div class="field">
      <label for="su-ref">추천인 아이디 (선택)</label>
      <input id="su-ref" type="text" placeholder="추천인 아이디 입력 시 포인트 지급">
      <p class="hint">가입자와 추천인 모두에게 포인트가 지급됩니다.</p>
    </div>
    <div class="field">
      <label for="su-email">이메일</label>
      <input id="su-email" type="email" placeholder="example@email.com" value="sunnyfit@example.com">
    </div>
    <div class="field">
      <label>활동 지역 (랭킹 산정 기준)</label>
      <div class="field-row">
        <select style="flex:1;min-width:0;"><option>서울시</option><option>부산시</option><option>대전시</option></select>
        <select style="flex:1;min-width:0;"><option>강남구</option><option>마포구</option><option>성동구</option></select>
        <select style="flex:1;min-width:0;"><option>역삼동</option><option>삼성동</option></select>
      </div>
      <p class="hint">랭킹은 동 단위로 집계됩니다.</p>
    </div>
    <div class="field">
      <label>카메라 캘리브레이션</label>
      <button class="btn btn-secondary btn-block">카메라로 체형 보정하기</button>
      <p class="hint">실제 웹캠으로 촬영 각도·거리·신체 비율을 미리 보정해 자세 분석 정확도를 높입니다.</p>
    </div>

    <button class="btn btn-primary btn-block" style="margin-top:6px;">가입하고 시작하기</button>
    <p class="switch-line">이미 계정이 있으신가요? <button>로그인</button></p>
  </div>
</div>
</body>
</html>
