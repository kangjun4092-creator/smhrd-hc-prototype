<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목업 · 크루공지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="04-main.html">
      <div class="brand-mark">홈</div>
      <div class="brand-name">우리동네<br>홈트챌린지<small>HOME TRAINING</small></div>
    </a>
    <div class="navitem"><span class="navicon"></span>메인</div>
    <div class="navitem"><span class="navicon"></span>운동</div>
    <div class="navitem"><span class="navicon"></span>미션</div>
    <div class="navitem"><span class="navicon"></span>마이페이지</div>
    <div class="navitem"><span class="navicon"></span>포인트 상점</div>
    <div class="navitem active"><span class="navicon"></span>홈크루</div>
    <div class="navitem"><span class="navicon"></span>랭킹</div>
    <div class="navitem"><span class="navicon"></span>고객센터</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">홈크루</div>
        <div class="topbar-sub">서울시 강남구 역삼동</div>
      </div>
      <div class="user-chip">
        <div class="points-pill">P <span class="mono">3,140</span></div>
        <span class="topbar-nick">써니핏</span>
        <div class="topbar-avatar">
          <div style="width:36px;height:36px;border-radius:50%;border:2px solid var(--outline);background:var(--surface-2);"></div>
          <span class="mono">Lv.7</span>
        </div>
      </div>
    </div>
    <div class="view">
      <div class="view-head"><h1>역삼동 스쿼트단</h1><p>크루 메인 → 크루공지 → 오늘의 단체 미션 → 크루원 정보</p></div>
      <div class="subtabs">
        <div class="tab">크루 메인</div>
        <div class="tab active">크루공지</div>
        <div class="tab">오늘의 단체 미션</div>
        <div class="tab">크루원 정보</div>
        <div class="tab">크루원관리</div>
      </div>

      <div class="card" style="max-width:520px;margin-bottom:16px;">
        <p class="section-label">공지 작성</p>
        <div class="field"><label>제목</label><input placeholder="예: 우리 크루 단톡방 안내"></div>
        <div class="field"><label>내용</label><textarea rows="3" placeholder="크루원에게 전달할 내용을 입력하세요 (예: 카카오톡 오픈채팅 '123' 검색)"></textarea></div>
        <button class="btn btn-primary">공지 등록</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="card">
          <div class="flex-between"><h3 style="margin:0;">우리 크루 단톡방 안내</h3><span class="hint" style="margin:0;">08.20</span></div>
          <p class="desc" style="margin-top:8px;white-space:pre-wrap;">카카오톡 오픈채팅방에서 '123' 검색해서 들어와주세요!</p>
          <p class="hint" style="margin:0;">작성자 · 써니핏</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
