<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목업 · 홈크루 생성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="04-main.html">
      <div class="brand-mark">홈</div>
      <div class="brand-name">우리동네<br>홈트챌린지<small>HOME TRAINING</small></div>
    </a>
    <div class="navitem"><span class="navicon"></span>메인</div>
    <div class="navitem"><span class="navicon"></span>운동</div>
    <div class="navitem"><span class="navicon"></span>미션</div>
    <div class="navitem"><span class="navicon"></span>마이페이지</div>
    <div class="navitem"><span class="navicon"></span>포인트 상점</div>
    <div class="navitem active"><span class="navicon"></span>홈크루</div>
    <div class="navitem"><span class="navicon"></span>랭킹</div>
    <div class="navitem"><span class="navicon"></span>고객센터</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">홈크루</div>
        <div class="topbar-sub">서울시 강남구 역삼동</div>
      </div>
      <div class="user-chip">
        <div class="points-pill">P <span class="mono">3,240</span></div>
        <span class="topbar-nick">써니핏</span>
        <div class="topbar-avatar">
          <div style="width:36px;height:36px;border-radius:50%;border:2px solid var(--outline);background:var(--surface-2);"></div>
          <span class="mono">Lv.7</span>
        </div>
      </div>
    </div>
    <div class="view">
      <div class="view-head"><h1>홈크루</h1><p>크루를 새로 만들거나 우리동네 크루에 가입해보세요</p></div>
      <div class="subtabs">
        <div class="tab active">크루 생성</div>
        <div class="tab">우리동네 크루 가입하기</div>
      </div>

      <div class="card" style="max-width:480px;">
        <p class="section-label">새 크루 만들기 (포인트 100 소모)</p>
        <div class="field">
          <label>활동 지역</label>
          <div class="hint" style="padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);">서울시 강남구 역삼동 <span style="color:var(--ink-faint);">(캘리브레이션 시 등록된 활동 지역)</span></div>
        </div>
        <div class="field"><label for="cr-name">크루 이름</label><input id="cr-name" placeholder="예: 역삼동 스쿼트단" value="역삼동 스쿼트단"></div>
        <div class="field"><label for="cr-desc">크루 소개</label><textarea id="cr-desc" rows="3" placeholder="어떤 크루인지 소개해주세요">함께 성장하는 홈트 크루입니다.</textarea></div>
        <button class="btn btn-primary btn-block">100P로 크루 생성</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
