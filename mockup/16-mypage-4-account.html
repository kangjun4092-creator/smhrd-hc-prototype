<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목업 · 마이페이지 4.계정·프로필 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="04-main.html">
      <div class="brand-mark">홈</div>
      <div class="brand-name">우리동네<br>홈트챌린지<small>HOME TRAINING</small></div>
    </a>
    <div class="navitem"><span class="navicon"></span>메인</div>
    <div class="navitem"><span class="navicon"></span>운동</div>
    <div class="navitem"><span class="navicon"></span>미션</div>
    <div class="navitem active"><span class="navicon"></span>마이페이지</div>
    <div class="navitem"><span class="navicon"></span>포인트 상점</div>
    <div class="navitem"><span class="navicon"></span>홈크루</div>
    <div class="navitem"><span class="navicon"></span>랭킹</div>
    <div class="navitem"><span class="navicon"></span>고객센터</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">마이페이지</div>
        <div class="topbar-sub">서울시 강남구 역삼동</div>
      </div>
      <div class="user-chip">
        <div class="points-pill">P <span class="mono">3,240</span></div>
        <span class="topbar-nick">써니핏</span>
        <div class="topbar-avatar">
          <div style="width:36px;height:36px;border-radius:50%;border:2px solid var(--outline);background:var(--surface-2);"></div>
          <span class="mono">Lv.7</span>
        </div>
      </div>
    </div>
    <div class="view">
      <div class="view-head"><h1>마이페이지</h1><p>캐릭터 꾸미기·미션·운동 기록부터 계정·설정 관리까지 한 곳에서 확인하세요.</p></div>
      <div class="subtabs">
        <div class="tab">프로필·캐릭터 꾸미기</div>
        <div class="tab">미션 달성 현황</div>
        <div class="tab">운동 히스토리</div>
        <div class="tab active">계정·프로필 관리</div>
        <div class="tab">캘리브레이션 재설정</div>
        <div class="tab">카메라·알림 설정</div>
        <div class="tab">개인정보·공개범위</div>
        <div class="tab">로그아웃·회원탈퇴</div>
      </div>

      <div class="card" style="max-width:460px;">
        <p class="section-label">프로필</p>
        <div class="field">
          <label for="acc-nick">닉네임</label>
          <input id="acc-nick" value="써니핏" disabled>
          <p class="hint">닉네임 변경은 포인트 상점에서 '닉네임 변경권'을 구매한 뒤 가능합니다.</p>
          <button class="btn btn-sm btn-secondary" style="margin-top:6px;">포인트 상점으로 이동</button>
        </div>
        <div class="field">
          <label>활동 지역</label>
          <div class="field-row">
            <select style="flex:1;min-width:0;"><option>서울시</option></select>
            <select style="flex:1;min-width:0;"><option>강남구</option></select>
            <select style="flex:1;min-width:0;"><option>역삼동</option></select>
          </div>
        </div>
        <button class="btn btn-primary">저장</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
