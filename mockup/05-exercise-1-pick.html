<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목업 · 운동 1.종목 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="04-main.html">
      <div class="brand-mark">홈</div>
      <div class="brand-name">우리동네<br>홈트챌린지<small>HOME TRAINING</small></div>
    </a>
    <div class="navitem"><span class="navicon"></span>메인</div>
    <div class="navitem active"><span class="navicon"></span>운동</div>
    <div class="navitem"><span class="navicon"></span>미션</div>
    <div class="navitem"><span class="navicon"></span>마이페이지</div>
    <div class="navitem"><span class="navicon"></span>포인트 상점</div>
    <div class="navitem"><span class="navicon"></span>홈크루</div>
    <div class="navitem"><span class="navicon"></span>랭킹</div>
    <div class="navitem"><span class="navicon"></span>고객센터</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">운동</div>
        <div class="topbar-sub">서울시 강남구 역삼동</div>
      </div>
      <div class="user-chip">
        <div class="points-pill">P <span class="mono">3,240</span></div>
        <span class="topbar-nick">써니핏</span>
        <div class="topbar-avatar">
          <div style="width:36px;height:36px;border-radius:50%;border:2px solid var(--outline);background:var(--surface-2);"></div>
          <span class="mono">Lv.7</span>
        </div>
      </div>
    </div>
    <div class="view">
      <div class="view-head">
        <h1>운동</h1>
        <p>운동 종목 선택 → 튜토리얼·스트레칭 → 웹캠 촬영 → 리플레이 자세 분석 → 결과·점수 저장</p>
      </div>
      <div class="subtabs">
        <div class="tab active">1. 종목 선택</div>
        <div class="tab">2. 튜토리얼</div>
        <div class="tab">3. 웹캠 촬영</div>
        <div class="tab">4. 리플레이 분석</div>
        <div class="tab">5. 결과 저장</div>
      </div>

      <p class="hint" style="margin-bottom:14px;">현재는 스쿼트 종목만 실시간 판정이 지원돼요. 다른 종목은 준비 중입니다.</p>
      <div class="grid grid-3">
        <div class="card exercise-card selected">
          <div class="ex-badge">스</div>
          <h3>스쿼트</h3>
          <p class="desc">타겟: 하체 · 둔근</p>
          <span class="pill pill-accent">초급</span>
        </div>
      </div>
      <div style="margin-top:20px;">
        <button class="btn btn-primary">운동 시작하기</button>
      </div>
    </div>
  </div>
</div>

</html>
