<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>홈챌린지 와이어프레임 · 상점/게시판/설정</title>
<style>
  body{font-family:'Malgun Gothic',sans-serif;background:#f4f4f4;padding:32px;margin:0;color:#333;}
  h1{font-size:18px;margin:0 0 24px;}
  .group{margin-bottom:36px;}
  .group h2{font-size:13px;color:#666;margin:0 0 14px;font-weight:600;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .phone{width:150px;background:#fff;border:1px solid #dcdcdc;border-radius:16px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .phone .label{font-size:10px;color:#999;text-align:center;margin-bottom:8px;}
  .ph-img{height:40px;border-radius:8px;background:repeating-linear-gradient(135deg,#eee,#eee 4px,#f6f6f6 4px,#f6f6f6 8px);margin-bottom:6px;}
  .ph-bar{height:7px;background:#e2e2e2;border-radius:3px;margin-bottom:6px;}
  .w60{width:60%}.w80{width:80%}.w50{width:50%}.w40{width:40%}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px;}
  .shopcard{background:#f5f5f7;border-radius:6px;height:36px;padding:4px;box-sizing:border-box;}
  .shopcard .p{height:5px;width:60%;background:#ccc;border-radius:3px;margin-top:6px;}
  .list-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
  .thumb{width:20px;height:20px;border-radius:4px;background:#e6e6e6;flex-shrink:0;}
  .settings-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .settings-row .toggle{width:20px;height:11px;border-radius:6px;background:#ddd;position:relative;}
  .settings-row .toggle.on{background:#8fa8ff;}
  .settings-row .toggle::after{content:'';position:absolute;top:1px;left:1px;width:9px;height:9px;border-radius:50%;background:#fff;}
  .settings-row .toggle.on::after{left:10px;}
  .ph-btn{height:18px;background:#c9c9c9;border-radius:4px;margin-top:6px;}
  .ph-btn.accent{background:#8fa8ff;}
  .nav{margin-bottom:20px;font-size:12px;}
  .nav a{color:#666;margin-right:12px;text-decoration:none;}
  .point-badge{display:inline-block;background:#ffe9a8;border-radius:10px;padding:2px 8px;font-size:9px;margin-bottom:6px;}
</style>
</head>
<body>
<div class="nav"><a href="index.html">← 목록으로</a></div>
<h1>홈챌린지 프로토타입 · 와이어프레임 — 포인트 상점 · 자랑 게시판 · 고객센터 · 설정</h1>

<div class="group">
<h2>포인트 상점</h2>
<div class="row">

  <div class="phone">
    <div class="label">상점 목록</div>
    <span class="point-badge">보유 P ●●●</span>
    <div class="cards">
      <div class="shopcard"><div class="p"></div></div>
      <div class="shopcard"><div class="p"></div></div>
      <div class="shopcard"><div class="p"></div></div>
      <div class="shopcard"><div class="p"></div></div>
    </div>
  </div>

  <div class="phone">
    <div class="label">아이템 상세 / 교환</div>
    <div class="ph-img"></div>
    <div class="ph-bar w60"></div>
    <div class="ph-bar w40"></div>
    <div class="ph-btn accent"></div>
  </div>

</div>
</div>

<div class="group">
<h2>자랑 게시판</h2>
<div class="row">

  <div class="phone">
    <div class="label">게시글 목록</div>
    <div class="list-row"><div class="thumb"></div><div style="flex:1;"><div class="ph-bar w80" style="margin-bottom:3px;"></div><div class="ph-bar w40" style="margin:0;"></div></div></div>
    <div class="list-row"><div class="thumb"></div><div style="flex:1;"><div class="ph-bar w60" style="margin-bottom:3px;"></div><div class="ph-bar w40" style="margin:0;"></div></div></div>
    <div class="ph-btn accent"></div>
  </div>

  <div class="phone">
    <div class="label">게시글 상세 / 댓글</div>
    <div class="ph-img"></div>
    <div class="ph-bar w80"></div>
    <div class="ph-bar w60"></div>
    <div class="list-row"><div class="thumb" style="border-radius:50%;"></div><div class="ph-bar w60" style="margin:0;"></div></div>
  </div>

  <div class="phone">
    <div class="label">글 작성</div>
    <div class="ph-img" style="height:56px;">사진 첨부</div>
    <div class="ph-bar w80"></div>
    <div class="ph-btn accent"></div>
  </div>

</div>
</div>

<div class="group">
<h2>고객센터</h2>
<div class="row">

  <div class="phone">
    <div class="label">FAQ / 문의 목록</div>
    <div class="ph-bar w80"></div>
    <div class="ph-bar w60"></div>
    <div class="ph-bar w80"></div>
    <div class="ph-btn" style="background:#eee;"></div>
  </div>

  <div class="phone">
    <div class="label">불편사항 접수</div>
    <div class="ph-bar w60"></div>
    <div style="height:36px;border:1px solid #ddd;border-radius:6px;margin-bottom:6px;background:#fafafa;"></div>
    <div class="ph-btn accent"></div>
  </div>

</div>
</div>

<div class="group">
<h2>계정 및 설정</h2>
<div class="row">

  <div class="phone">
    <div class="label">설정</div>
    <div class="settings-row"><div class="ph-bar w40" style="margin:0;"></div><div class="toggle on"></div></div>
    <div class="settings-row"><div class="ph-bar w50" style="margin:0;"></div><div class="toggle"></div></div>
    <div class="settings-row"><div class="ph-bar w40" style="margin:0;"></div><div class="toggle on"></div></div>
    <div class="ph-btn" style="background:#f0c4c4;"></div>
  </div>

</div>
</div>

</body>
</html>
