<!doctype html>
<!--
  일회성 개발 도구: Bodyweight_Squats.gif를 재생시키며 매 프레임을 캔버스로 스냅샷하고
  MediaPipe Pose(IMAGE 모드)로 무릎 각도를 측정해, script.js의 SQUAT_REFERENCE 상수에
  넣을 값(standingKneeAngle / bottomKneeAngle)을 뽑아낸다. 앱 본체에서는 로드하지 않는다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스쿼트 레퍼런스 데이터 추출</title>
<style>
  body{font-family:'Malgun Gothic',sans-serif;background:#111;color:#eee;padding:24px;}
  button{font-size:15px;padding:8px 16px;cursor:pointer;}
  #status{margin:14px 0;color:#9AA0A6;font-family:monospace;}
  #preview{display:flex;gap:16px;align-items:flex-start;margin-top:14px;}
  canvas{background:#000;border:1px solid #444;}
  pre{background:#1b1b1b;border:1px solid #333;padding:14px;white-space:pre-wrap;max-width:560px;}
</style>
</head>
<body>
<h2>스쿼트 레퍼런스 데이터 추출</h2>
<p>GIF를 ~9초간 재생하며 매 프레임 무릎 각도를 샘플링합니다. 완료되면 아래에 SQUAT_REFERENCE 값이 출력됩니다.</p>
<button id="start-btn" onclick="startExtraction()">추출 시작</button>
<div id="status">대기중</div>
<div id="preview">
  <img id="gifimg" src="../Bodyweight_Squats.gif" style="width:270px;height:270px;object-fit:cover;">
  <canvas id="sample-canvas" width="270" height="270"></canvas>
</div>
<pre id="output">(아직 결과 없음)</pre>

<script type="module">
let landmarker=null;
const SAMPLE_MS=100;
const SAMPLE_WINDOW_MS=9000;
const IDX={lhip:23,rhip:24,lknee:25,rknee:26,lank:27,rank:28};
const VIS_THRESHOLD=0.5;

function angleAt(a,b,c){
  const v1x=a.x-b.x, v1y=a.y-b.y;
  const v2x=c.x-b.x, v2y=c.y-b.y;
  const mag1=Math.hypot(v1x,v1y), mag2=Math.hypot(v2x,v2y);
  if(mag1===0||mag2===0) return null;
  let cos=(v1x*v2x+v1y*v2y)/(mag1*mag2);
  cos=Math.max(-1,Math.min(1,cos));
  return Math.acos(cos)*180/Math.PI;
}
function kneeAngle(lm){
  const need=[IDX.lhip,IDX.rhip,IDX.lknee,IDX.rknee,IDX.lank,IDX.rank];
  if(need.some(i=>!lm[i] || (lm[i].visibility??1)<VIS_THRESHOLD)) return null;
  const l=angleAt(lm[IDX.lhip],lm[IDX.lknee],lm[IDX.lank]);
  const r=angleAt(lm[IDX.rhip],lm[IDX.rknee],lm[IDX.rank]);
  if(l==null && r==null) return null;
  if(l==null) return r;
  if(r==null) return l;
  return (l+r)/2;
}

async function loadLandmarker(){
  const {PoseLandmarker, FilesetResolver} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  return PoseLandmarker.createFromOptions(vision, {
    baseOptions:{
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
      delegate:'GPU',
    },
    runningMode:'IMAGE', numPoses:1,
  });
}

function percentile(sorted, p){
  const idx=Math.min(sorted.length-1, Math.max(0, Math.round((sorted.length-1)*p)));
  return sorted[idx];
}

window.startExtraction = async function(){
  const btn=document.getElementById('start-btn');
  const statusEl=document.getElementById('status');
  const outEl=document.getElementById('output');
  const img=document.getElementById('gifimg');
  const canvas=document.getElementById('sample-canvas');
  const ctx=canvas.getContext('2d');
  btn.disabled=true;
  statusEl.textContent='MediaPipe 모델 로딩중...';
  if(!landmarker) landmarker = await loadLandmarker();

  const samples=[];
  statusEl.textContent='샘플링 중... (0개)';
  await new Promise(resolve=>{
    const startTs=performance.now();
    const timer=setInterval(()=>{
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const res=landmarker.detect(canvas);
      if(res.landmarks && res.landmarks[0]){
        const a=kneeAngle(res.landmarks[0]);
        if(a!=null) samples.push(a);
      }
      statusEl.textContent=`샘플링 중... (${samples.length}개)`;
      if(performance.now()-startTs>=SAMPLE_WINDOW_MS){
        clearInterval(timer);
        resolve();
      }
    }, SAMPLE_MS);
  });

  if(samples.length<10){
    statusEl.textContent='샘플이 너무 적습니다. 사람이 인식되지 않았을 수 있습니다.';
    btn.disabled=false;
    return;
  }
  const sorted=[...samples].sort((a,b)=>a-b);
  const standingKneeAngle=Math.round(percentile(sorted,0.9)*10)/10;
  const bottomKneeAngle=Math.round(percentile(sorted,0.1)*10)/10;
  const result={
    standingKneeAngle, bottomKneeAngle,
    perfectTol:6, greatTol:12, goodTol:20,
    sampleCount:samples.length,
  };
  statusEl.textContent=`완료 (샘플 ${samples.length}개)`;
  outEl.textContent='const SQUAT_REFERENCE = '+JSON.stringify(result,null,2)+';';
  console.log('SQUAT_REFERENCE', result);
  btn.disabled=false;
};
</script>
</body>
</html>
